<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base :: Layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

	<section>

		<!--Start Slider  -->
		<div id="carouselExample" class="carousel slide">
			<div class="carousel-inner">
				<div class="carousel-item active">
					<img src="/img/shutter-speed-BQ9usyzHx_w-unsplash.jpg"
						class="d-block w-100" height="350" alt="Banner 1">
				</div>
				<div class="carousel-item">
					<img src="/img/Untitled design.png" class="d-block w-100"
						height="350" alt="Banner 2">
				</div>
				<div class="carousel-item">
					<img src="/img/growtika--_jFGWIE6fg-unsplash.jpg"
						class="d-block w-100" height="350" alt="Banner 3">
				</div>
			</div>
			<button class="carousel-control-prev" type="button"
				data-bs-target="#carouselExample" data-bs-slide="prev">
				<span class="carousel-control-prev-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Previous</span>
			</button>
			<button class="carousel-control-next" type="button"
				data-bs-target="#carouselExample" data-bs-slide="next">
				<span class="carousel-control-next-icon" aria-hidden="true"></span>
				<span class="visually-hidden">Next</span>
			</button>
		</div>

		<!--Start Slider  -->


		<!--Start Category module  -->

		<div class="container">
			<div class="row">
				<p class="text-center fs-4">Category</p>
				<div class="col-md-2">
					<div class="card category-card">
						<div class="card-body text-center ">

							<img src="/img/category/Appliances.png"
								class="category-img img-fluid" alt="Appliance">
							<p>Appliances</p>
						</div>

					</div>
				</div>

				<div class="col-md-2">
					<div class="card category-card">
						<div class="card-body text-center ">

							<img src="/img/category/Mobile.jpg"
								class="category-img img-fluid  max-auto" alt="Mobile">
							<p>Mobile</p>
						</div>

					</div>
				</div>

				<div class="col-md-2">
					<div class="card category-card">
						<div class="card-body text-center ">

							<img src="/img/category/Fashion.jpg"
								class="category-img img-fluid" alt="Fashion">
							<p>Fashion</p>
						</div>

					</div>
				</div>

				<div class="col-md-2">
					<div class="card category-card">
						<div class="card-body text-center ">

							<img src="/img/category/Beauty.jpg"
								class="category-img img-fluid" alt="Beauty">
							<p>Beauty</p>
						</div>

					</div>
				</div>

				<div class="col-md-2">
					<div class="card category-card">
						<div class="card-body text-center ">

							<img src="/img/category/Grocery.jpg"
								class="category-img img-fluid" alt="Grocery">
							<p>Grocery</p>
						</div>

					</div>
				</div>

				<div class="col-md-2">
					<div class="card category-card">
						<div class="card-body text-center ">

							<img src="/img/category/Books.jpg" class="category-img img-fluid"
								alt="Books">
							<p>Books</p>
						</div>

					</div>
				</div>
			</div>
		</div>



		<!--End Category Module  -->

		<!--Start Latest Product Module  -->

		<div class="container fluid-bg">

				<p class="text-center fs-4">Latest product</p>

				<div class="col-md-3">
					<div class="card">
						<div class="card-body text-center">
							<img alt="" src="/img/rupixen-Q59HmzK38eQ-unsplash.jpg " class=""
								width=65% height=140px>
							<p class="text-center">HP Laptop</p>

					</div>
				</div>

				<div class="col-md-3">

							<img alt="" src="/img/rupixen-Q59HmzK38eQ-unsplash.jpg " class=""
								width=65% height=140px>
							<p class="text-center">HP Laptop</p>
						</div>
					</div>
				</div>

				<div class="col-md-3">
					<div class="card">
						<div class="card-body text-center">
							<img alt="" src="/img/rupixen-Q59HmzK38eQ-unsplash.jpg " class=""
								width=65% height=140px>
							<p class="text-center">HP Laptop</p>
						</div>

							<img alt="" src="/img/rupixen-Q59HmzK38eQ-unsplash.jpg " class=""
								width=65% height=140px>
							<p class="text-center">HP Laptop</p>
						</div>
					</div>

			</div>
		</div>

		<!--End Latest Product  Module  -->


	</section>
</body>
</html>
